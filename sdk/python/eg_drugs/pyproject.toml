[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "eg-drugs"
version = "1.0.0"
description = "Python SDK for the Egyptian Drug Database (eg-drugs) - 27,617+ drugs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Abduallah Jamal", email = "abduallahjamal@users.noreply.github.com" }]
keywords = ["egypt", "drugs", "pharmaceutical", "database", "eg-drugs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Medical Science :: Imaging",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eg_drugs*"]
