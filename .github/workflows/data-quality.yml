name: Data Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run data quality checks
        run: |
          python tools/data_quality.py --db data/eg_drugs.sqlite --report quality-report.json
          echo "--- Data quality report ---"
          cat quality-report.json | python3 -c "
import sys,json
r=json.load(sys.stdin)
print('Total records:', r['total_records'])
print('Total issues:', r['summary']['total_issues'])
print('Missing fields:', r['summary']['missing_fields_count'])
print('Duplicate groups:', r['summary']['duplicate_groups_count'])
print('Price anomalies:', r['summary']['price_anomalies_count'])
print('Barcode issues:', r['summary']['barcode_issues_count'])
"
          # Notify if issues found (do not fail the build automatically)
          python3 -c "
import json
r=json.load(open('quality-report.json'))
if r['summary']['total_issues'] > 0:
    print('Warning: data quality issues found that require review.')
"
          echo "Data quality check completed."
