name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run API smoke tests
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -s http://127.0.0.1:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'; print('health ok')"
          curl -s "http://127.0.0.1:8000/drugs/search?q=panadol&limit=3" | python3 -c "import sys,json; d=json.load(sys.stdin); print('search results:', len(d))"
          curl -s "http://127.0.0.1:8000/stats" | python3 -c "import sys,json; d=json.load(sys.stdin); print('total drugs:', d['total_drugs'])"
          echo "All smoke tests passed!"
